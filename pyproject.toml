[project]
name = "loopforge"
version = "0.1.0"
description = "Generate new top loops (hats/shakers/percussion) from your own sample library, guided by reference loops."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ui = ["gradio>=4"]

[project.scripts]
loopforge = "loopforge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
